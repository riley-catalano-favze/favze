# Rebuilds search-index.json whenever pages change, so site search always
# includes every page and every word. Runs on GitHub after each push to main.
name: Update search index

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'tools/build-search-index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build search index
        run: python3 tools/build-search-index.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- search-index.json; then
            echo "Search index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git commit -m "Update search index"
          git push
